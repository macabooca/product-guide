<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>دليل المنتجات</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
(function(){var p='auto';try{p=localStorage.getItem('pg-theme')||'auto';}catch(e){}
var d=p==='dark'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<style>
:root{--page:#ffffff;--card:#ffffff;--soft:#EEF1F0;--ink:#16302B;--mute:#5E726D;--line:#DCE4E1;--teal:#0F766E;--onteal:#ffffff;--danger:#B3261E;--redbtn:#D93025;--sbBg:#ffffff;--sbBorder:#F3D9B5;--sbText:#8A7358;--lockBg:#FFD98A;--lockInk:#5A3E00;--badgeBg:#16302B;--badgeInk:#ffffff;--allbg:#16302B;--allfg:#ffffff;color-scheme:light}
:root[data-theme="dark"]{--page:#000000;--card:#141414;--soft:#1A1A1A;--ink:#ffffff;--mute:#A8B4B0;--line:#2A2A2A;--teal:#5FD1C4;--onteal:#06201C;--danger:#F2877F;--sbBg:#141414;--sbBorder:#5E4B2B;--sbText:#B5A180;--allbg:#E6EDEB;--allfg:#111111;color-scheme:dark}
.cc0{--cbg:#FBE3D3;--cfg:#B84A1B}.cc1{--cbg:#D7EEE4;--cfg:#1F5E4B}.cc2{--cbg:#F9D9E4;--cfg:#A63A66}.cc3{--cbg:#FBEBCB;--cfg:#8A5A0F}.cc4{--cbg:#DCEBF7;--cfg:#255F94}.cc5{--cbg:#E6E3F5;--cfg:#4B3FA0}.cc6{--cbg:#FADBD8;--cfg:#A32B20}.cc7{--cbg:#D3F0F2;--cfg:#176B73}.cc8{--cbg:#E6F2CF;--cfg:#4B6B10}.cc9{--cbg:#EADBCB;--cfg:#6B4423}.cc10{--cbg:#E1E6EB;--cfg:#3F4F61}.cc11{--cbg:#F3D9F0;--cfg:#8A2C80}
:root[data-theme="dark"] .cc0{--cbg:#3A2418;--cfg:#F2A47C}:root[data-theme="dark"] .cc1{--cbg:#17332B;--cfg:#7FD1B0}:root[data-theme="dark"] .cc2{--cbg:#3A1A27;--cfg:#F29AB9}:root[data-theme="dark"] .cc3{--cbg:#35290F;--cfg:#F2C46D}:root[data-theme="dark"] .cc4{--cbg:#15293B;--cfg:#8CC2EE}:root[data-theme="dark"] .cc5{--cbg:#25214A;--cfg:#B0A8F0}
:root[data-theme="dark"] .cc6{--cbg:#3A1D1A;--cfg:#F59A90}:root[data-theme="dark"] .cc7{--cbg:#12333A;--cfg:#7FD6DE}:root[data-theme="dark"] .cc8{--cbg:#2A3512;--cfg:#C2DE80}:root[data-theme="dark"] .cc9{--cbg:#33261A;--cfg:#D9B08A}:root[data-theme="dark"] .cc10{--cbg:#26303A;--cfg:#B4C4D4}:root[data-theme="dark"] .cc11{--cbg:#3A1F37;--cfg:#E79DDD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--page);color:var(--ink);font-family:Cairo,system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{padding:0 10px calc(env(safe-area-inset-bottom,0px) + 100px)}
.top{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--sbBg);border:2px solid var(--sbBorder);border-radius:26px;height:48px;padding:0 8px 0 14px;color:var(--sbText)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:0;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--sbText)}
.sbox input::-webkit-search-cancel-button{display:none}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib.plain{background:transparent;width:34px;height:34px}
.sbox .ib.plain{color:var(--sbText);border-radius:50%}
.lock{width:48px;height:48px;border-radius:50%;border:0;background:var(--lockBg);color:var(--lockInk);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.mgr{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.badge{background:var(--teal);color:var(--onteal);border-radius:8px;padding:2px 10px;font-size:12.5px;font-weight:700}
.sp{flex:1}
.lnk{border:0;background:transparent;color:var(--mute);font-size:13px;padding:6px 4px}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 12px;margin:0 -2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;font-size:10.5px;font-weight:700;color:var(--ink)}
.cat i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cbg);color:var(--cfg);font-style:normal}
.cat.all i{background:var(--allbg);color:var(--allfg)}
.cat.on i{outline:2.5px solid var(--teal);outline-offset:2px}
.cat span{max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;row-gap:0}
.card{display:grid;grid-row:span 3;grid-template-rows:subgrid;min-width:0;margin-bottom:12px;align-content:start;cursor:pointer}
@supports not (grid-template-rows:subgrid){.card{display:flex;flex-direction:column}}
.card:active{opacity:.9}
.card,.pc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pc{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--soft);touch-action:pan-y;line-height:0}
.trk{display:flex;direction:rtl;width:100%;height:100%}
.trk img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.pc.anim .trk{transition:transform .22s ease-out}
.pb{position:absolute;bottom:6px;right:6px;background:var(--badgeBg);color:var(--badgeInk);font-size:14px;font-weight:700;border-radius:11px;padding:3px 10px;line-height:1.6;pointer-events:none}
.seg{position:absolute;top:4px;left:6px;right:6px;display:flex;gap:2px;z-index:2;pointer-events:none;direction:rtl}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.5);box-shadow:0 0 2px rgba(0,0,0,.45)}
.seg i.on{background:#fff}
.pen{position:absolute;top:10px;left:5px;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.tag{position:absolute;top:10px;right:5px;background:var(--lockBg);color:var(--lockInk);font-size:9.5px;font-weight:700;border-radius:7px;padding:0 6px;line-height:1.6;z-index:3;pointer-events:none}
.t{font-size:12.5px;font-weight:700;line-height:1.4;margin:5px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:10.5px;color:var(--mute);line-height:1.45;margin:1px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--mute);font-size:14px;line-height:1.9;padding:60px 20px}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:54px;height:54px;border-radius:50%;border:0;background:var(--teal);color:var(--onteal);display:flex;align-items:center;justify-content:center;z-index:6;padding:0}
.fab:active{transform:scale(.95)}
.bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 8px;position:sticky;top:0;background:var(--page);z-index:5}
.bar .back{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:14px;color:var(--mute);padding:6px 0}
.dimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
.thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{flex:0 0 calc(33.333% - 4px);height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.thumbs img.on{outline:2px solid var(--teal);outline-offset:-1px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.head h1{font-size:20px;font-weight:700;margin:0;line-height:1.4}
.head .pr{font-size:17px;font-weight:700;color:var(--teal);white-space:nowrap}
.short{font-size:14px;color:var(--ink);line-height:1.7;margin-top:4px;white-space:pre-wrap}
.long{font-size:14px;color:var(--mute);line-height:1.9;margin-top:8px;white-space:pre-wrap}
.tip{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.9;color:var(--mute);white-space:pre-wrap}
.tip b{color:var(--ink)}
.fl{font-size:13px;font-weight:700;margin:14px 2px 5px}
.in{width:100%;background:var(--soft);border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);outline:0;line-height:1.6}
textarea.in{resize:vertical;min-height:90px}
.warn{color:var(--danger);font-size:13px;margin:5px 2px 0;line-height:1.6}
.drop{border:1.5px dashed var(--teal);border-radius:12px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--teal);font-size:13px;gap:4px;cursor:pointer;background:transparent;width:100%}
.mainprev{position:relative;border-radius:12px;overflow:hidden}
.mainprev .chg{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:12.5px}
.exrow{display:flex;gap:8px;flex-wrap:wrap}
.ex{position:relative;width:calc(25% - 6px);aspect-ratio:1/1;border-radius:9px;overflow:hidden}
.ex img{width:100%;height:100%;object-fit:cover}
.ex button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.exadd{width:calc(25% - 6px);aspect-ratio:1/1;border-radius:9px;border:1.5px dashed var(--line);background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;padding:0}
.fcats{display:flex;flex-wrap:wrap;gap:6px}
.fc{border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.fc.on{background:var(--teal);border-color:var(--teal);color:var(--onteal)}
.fc.new{border-style:dashed;color:var(--mute)}
.btn{flex:1;border:0;border-radius:12px;padding:11px;font-size:15px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.main{background:var(--teal);color:var(--onteal)}
.btn.cancel{background:var(--redbtn);color:#fff}
.btn.danger{background:var(--redbtn);color:#fff}
.btn.off{opacity:.45}
.btns{display:flex;gap:8px;margin-top:14px}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--page);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
.fbar .btn{margin:0}
.del{display:block;width:100%;border:0;background:transparent;color:var(--danger);font-size:13.5px;margin-top:18px;padding:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mbox{width:min(100%,330px);background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);max-height:86vh;overflow-y:auto}
.mbox h3{margin:0 0 10px;font-size:16px;text-align:center}
.mbox p{margin:0 0 4px;font-size:14px;line-height:1.8;color:var(--mute);text-align:center}
.pin{width:100%;text-align:center;font-size:26px;letter-spacing:12px;direction:ltr;background:var(--soft);border:0;border-radius:12px;padding:10px;color:var(--ink);outline:0;font-family:inherit}
.err{color:var(--danger);font-size:13px;text-align:center;min-height:22px;margin-top:6px}
.mi{display:block;width:100%;text-align:right;border:0;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:8px}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:0;background:var(--soft);border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-top:8px}
.big small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px;max-height:208px;overflow-y:auto;padding:2px}
.pv{display:flex;justify-content:center;margin:2px 0 12px}.pv i{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cbg);color:var(--cfg);font-style:normal}
.sws{display:flex;flex-wrap:wrap;gap:9px;padding:3px}.sws button{width:30px;height:30px;border-radius:50%;border:0;background:var(--cfg);padding:0}.sws button.on{outline:3px solid var(--ink);outline-offset:2px}
.icons button{aspect-ratio:1/1;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.icons button.on{border-color:var(--teal);background:var(--soft)}
.crow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:8px 10px;margin-top:8px}
.crow i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cbg);color:var(--cfg);font-style:normal;flex:none}
.crow span{flex:1;font-size:14px;font-weight:700}
#hd{position:fixed;right:0;top:0;width:30px;height:112px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;touch-action:none}
#hd.show{opacity:1;pointer-events:auto}
#hdb{position:absolute;right:3px;top:0;width:10px;height:96px;border-radius:5px;background:var(--mute);opacity:.75;transition:width .15s,height .15s,opacity .15s}
#hd.grab #hdb{width:16px;height:112px;opacity:.95}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:rgba(20,30,28,.94);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="vList">
    <div class="top">
      <div class="sbox">
        <span id="icS"></span>
        <input id="q" type="search" placeholder="ابحث عن منتج" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="qx" class="ib plain" aria-label="مسح" hidden></button>
        <button id="themeBtn" class="ib plain" aria-label="الوضع الفاتح والداكن"></button>
      </div>
      <button id="lockBtn" class="lock" aria-label="وضع المدير"></button>
    </div>
    <div id="mgr" class="mgr" hidden>
      <span class="badge">وضع المدير</span>
      <span class="sp"></span>
      <button id="menuBtn" class="ib plain" aria-label="القائمة"></button>
      <button id="exitBtn" class="lnk">خروج</button>
    </div>
    <div id="cats" class="cats" hidden></div>
    <div id="grid" class="grid3"></div>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div id="vDetail" hidden></div>
  <div id="vForm" hidden></div>
</div>
<button id="fab" class="fab" aria-label="إضافة منتج" hidden></button>
<input id="restoreIn" type="file" accept="application/json,.json" hidden>
<input id="bulkIn" type="file" accept="image/*" multiple hidden>
<div id="hd"><div id="hdb"></div></div>
<div id="toast"></div>
<div id="modalRoot"></div>

/* database */
var db;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('productGuide',1);r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('products',{keyPath:'id'});d.createObjectStore('images',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=function(){db=r.result;res();};r.onerror=function(){rej(r.error);};});}
function reqP(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function getAll(s){return reqP(db.transaction(s).objectStore(s).getAll());}
function getOne(s,k){return reqP(db.transaction(s).objectStore(s).get(k));}
function runTx(names,fn){return new Promise(function(res,rej){var t=db.transaction(names,'readwrite');fn(t);t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('abort'));};});}
function putMany(pairs){var names=[];pairs.forEach(function(p){if(names.indexOf(p[0])<0)names.push(p[0]);});return runTx(names,function(t){pairs.forEach(function(p){t.objectStore(p[0]).put(p[1]);});});}
function delProduct(id){return runTx(['products','images'],function(t){t.objectStore('products').delete(id);t.objectStore('images').delete(id);});}
function replaceAll(ps,ims,cs){return runTx(['products','images','meta'],function(t){var a=t.objectStore('products'),b=t.objectStore('images');a.clear();b.clear();ps.forEach(function(p){a.put(p);});ims.forEach(function(i){b.put(i);});t.objectStore('meta').put({k:'cats',v:cs||[]});});}

var products=[],cats=[],byId={};
function clean(p){var c={};for(var k in p){if(k.charAt(0)!=='_')c[k]=p[k];}return c;}
function prep(p){p._w=norm(p.name).split(' ');p._nn=norm(p.name);p._nd=norm(p.desc||'');return p;}
function loadProducts(){return getAll('products').then(function(a){a.forEach(prep);a.sort(function(x,y){return (y.created||0)-(x.created||0);});products=a;byId={};a.forEach(function(p){byId[p.id]=p;});});}
function loadCats(){return getOne('meta','cats').then(function(m){cats=m&&m.v?m.v:[];});}
function saveCats(){return putMany([['meta',{k:'cats',v:cats}]]);}
function catById(id){for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i];return null;}
function nameExists(name,exceptId){var n=norm(name);if(!n)return false;return products.some(function(p){return p.id!==exceptId&&p._nn===n;});}

/* images */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function shrink(src,max,q){return loadImg(src).then(function(im){var s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',q);});}
function fileToData(f,max,q){var u=URL.createObjectURL(f);return shrink(u,max,q).then(function(d){URL.revokeObjectURL(u);return d;},function(e){URL.revokeObjectURL(u);throw e;});}
function migrateThumbs(){
 var todo=products.filter(function(p){return !p.xthumbs;});
 if(!todo.length)return Promise.resolve();
 var chain=Promise.resolve();
 todo.forEach(function(p){chain=chain.then(function(){return getOne('images',p.id).then(function(im){var ex=(im&&im.extra)||[];var out=[];var c=Promise.resolve();ex.forEach(function(s){c=c.then(function(){return shrink(s,360,0.72).then(function(t){out.push(t);});});});return c.then(function(){var np=clean(p);np.xthumbs=out;return putMany([['products',np]]);});});}).catch(function(){});});
 return chain.then(loadProducts).then(function(){if(st.v==='list')renderList();});
}

/* search */
function lev1(a,b){if(a===b)return true;var la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;var i=0,j=0,d=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;}else{if(++d>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}}if(i<la||j<lb)d++;return d<=1;}
function scoreP(p,tk,full){
 var total=0;
 for(var k=0;k<tk.length;k++){
  var t=tk[k],s=0;
  if(p._w.some(function(w){return w.indexOf(t)===0;}))s=3;
  else if(p._nn.indexOf(t)>=0)s=2;
  else if(p._nd.indexOf(t)>=0)s=1;
  else if(t.length>=4&&p._w.some(function(w){return w.length>=4&&(lev1(w.slice(0,t.length),t)||lev1(w,t));}))s=1.5;
  if(!s)return 0;
  total+=s;
 }
 if(p._nn.indexOf(full)===0)total+=2;
 return total;
}

}
function renderList(){
 var raw=$('#q').value,q=norm(raw),tk=q?q.split(' '):[];
 $('#qx').hidden=!raw;
 renderCats();
 var list=products;
 if(selCat)list=list.filter(function(p){return p.cat===selCat;});
 if(tk.length){
  var sc=[];
  list.forEach(function(p){var s=scoreP(p,tk,q);if(s>0)sc.push([p,s]);});
  sc.sort(function(a,b){return b[1]-a[1]||(b[0].created||0)-(a[0].created||0);});
  list=sc.map(function(x){return x[0];});
 }
 var g=$('#grid'),em=$('#empty');
 if(!list.length){g.innerHTML='';em.hidden=false;em.textContent=(tk.length||selCat)?'لا توجد نتائج':(isMgr?'ابدأ بإضافة أول منتج بالضغط على زر +':'لا توجد منتجات بعد. اطلب من المدير إضافتها.');return;}
 em.hidden=true;
 g.innerHTML=list.map(function(p){
  var n=p.xthumbs?p.xthumbs.length:0;

/* swipe through pictures */
var sw=null;
function slideTo(pc,i,anim){var trk=pc.querySelector('.trk');pc.dataset.i=i;var W=pc.clientWidth;pc.classList.toggle('anim',!!anim);trk.style.transform='translateX('+(i*W)+'px)';var s=pc.querySelectorAll('.seg i');for(var k=0;k<s.length;k++)s[k].classList.toggle('on',k===i);}
$('#grid').addEventListener('pointerdown',function(e){
 var pc=e.target.closest('.pc');if(!pc||e.target.closest('.pen'))return;
 var p=byId[pc.parentNode.dataset.id];if(!p||!p.xthumbs||!p.xthumbs.length)return;
 var trk=pc.querySelector('.trk');
 if(trk.children.length<1+p.xthumbs.length){p.xthumbs.forEach(function(s){var im=document.createElement('img');im.src=s;im.alt='';im.draggable=false;trk.appendChild(im);});}
 pc.classList.remove('anim');
 sw={pc:pc,id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,i:+pc.dataset.i||0,n:1+p.xthumbs.length,W:pc.clientWidth,drag:false};
});
$('#grid').addEventListener('pointermove',function(e){
 if(!sw||e.pointerId!==sw.id)return;
 var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(!sw.drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){sw.drag=true;try{sw.pc.setPointerCapture(e.pointerId);}catch(_){}}else return;}
 sw.dx=dx;
 var pos=Math.min((sw.n-1)*sw.W,Math.max(0,sw.i*sw.W+dx));
 sw.pc.querySelector('.trk').style.transform='translateX('+pos+'px)';
});
function swEnd(e){
 if(!sw||(e&&e.pointerId!==sw.id))return;
 if(sw.drag){
  var ni=sw.i;
  if(sw.dx>sw.W*0.2&&ni<sw.n-1)ni++;else if(sw.dx<-sw.W*0.2&&ni>0)ni--;
  slideTo(sw.pc,ni,true);
  suppressClick=true;setTimeout(function(){suppressClick=false;},60);
 }
 sw=null;
}
$('#grid').addEventListener('dragstart',function(e){e.preventDefault();});
$('#grid').addEventListener('selectstart',function(e){e.preventDefault();});
$('#grid').addEventListener('pointerup',swEnd);
$('#grid').addEventListener('pointercancel',swEnd);

var hd=$('#hd'),ht,dragH=false,curTop=0,dOff=0;
function hdRange(){var vh=window.innerHeight;return [Math.round(vh*0.15),Math.round(vh*0.85)-112];}
function placeHd(){var de=document.documentElement,max=de.scrollHeight-window.innerHeight;var r=max>0?Math.min(1,Math.max(0,window.scrollY/max)):0;var rg=hdRange();curTop=Math.round(rg[0]+r*(rg[1]-rg[0]));hd.style.transform='translateY('+curTop+'px)';}
function hideSoon(){clearTimeout(ht);ht=setTimeout(function(){if(!dragH)hd.classList.remove('show');},1500);}
window.addEventListener('scroll',function(){
 var de=document.documentElement,max=de.scrollHeight-window.innerHeight;
 if(max<=40)return;
 if(!dragH)placeHd();
 hd.classList.add('show');hideSoon();
},{passive:true});
hd.addEventListener('pointerdown',function(e){dragH=true;hd.classList.add('grab');try{hd.setPointerCapture(e.pointerId);}catch(_){}clearTimeout(ht);dOff=e.clientY-curTop;e.preventDefault();});
hd.addEventListener('pointermove',function(e){
 if(!dragH)return;
 var de=document.documentElement,max=de.scrollHeight-window.innerHeight,rg=hdRange();
 var top=Math.min(rg[1],Math.max(rg[0],e.clientY-dOff));
 var r=rg[1]>rg[0]?(top-rg[0])/(rg[1]-rg[0]):0;
 curTop=Math.round(top);hd.style.transform='translateY('+curTop+'px)';
 window.scrollTo(0,r*max);
});
function endH(){if(!dragH)return;dragH=false;hd.classList.remove('grab');hideSoon();}
hd.addEventListener('pointerup',endH);hd.addEventListener('pointercancel',endH);

$('#lockBtn').innerHTML=ic('lock',21,2.2);

$('#lockBtn').onclick=login;
$('#exitBtn').onclick=logout;

$('#fab').onclick=addChoice;
$('#cats').addEventListener('click',function(e){var b=e.target.closest('.cat');if(!b)return;selCat=b.dataset.c;renderList();});
$('#grid').addEventListener('click',function(e){
 if(suppressClick){suppressClick=false;return;}
 var pe=e.target.closest('[data-edit]');
 if(pe){e.stopPropagation();nav({v:'form',id:pe.dataset.edit,from:'list'});return;}
 var c=e.target.closest('.card');if(c)nav({v:'detail',id:c.dataset.id});
});

openDB().then(loadProducts).then(loadCats).then(function(){
 history.replaceState({v:'list'},'');
 show({v:'list'});
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 migrateThumbs();
}).catch(function(){
 $('#empty').hidden=false;$('#empty').textContent='تعذر فتح قاعدة البيانات. تأكد أن التصفح الخاص غير مفعل.';
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}
})();
