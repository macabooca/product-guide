<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>دليل المنتجات</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--page:#ffffff;--card:#ffffff;--soft:#EEF1F0;--ink:#16302B;--mute:#5E726D;--line:#DCE4E1;--teal:#0F766E;--danger:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--page:#101a18;--card:#182623;--soft:#223330;--ink:#E7F1EE;--mute:#9DB3AD;--line:#2A3D39;--teal:#5FD1C4;--danger:#F2877F;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--page);color:var(--ink);font-family:Cairo,system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{padding:0 10px calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 8px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;height:42px;padding:0 12px;color:var(--mute)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:0;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--mute)}
.sbox input::-webkit-search-cancel-button{display:none}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib.plain{background:transparent;width:34px;height:34px}
.mgr{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.badge{background:var(--teal);color:#fff;border-radius:8px;padding:2px 10px;font-size:12.5px;font-weight:700}
@media (prefers-color-scheme:dark){.badge{color:#06201C}}
.sp{flex:1}
.lnk{border:0;background:transparent;color:var(--mute);font-size:13px;padding:6px 4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;padding-top:6px}
.card{display:flex;flex-direction:column;cursor:pointer}
.card:active{opacity:.85}
.pic{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pen{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.t{font-size:12.5px;font-weight:700;line-height:1.4;margin:5px 1px 1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:10.5px;color:var(--mute);line-height:1.45;margin:0 1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p{font-size:12px;font-weight:700;color:var(--teal);margin:auto 1px 0;padding-top:4px}
.empty{text-align:center;color:var(--mute);font-size:14px;line-height:1.9;padding:60px 20px}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:54px;height:54px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;z-index:6;padding:0}
@media (prefers-color-scheme:dark){.fab{color:#06201C}}
.fab:active{transform:scale(.95)}
.bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 8px;position:sticky;top:0;background:var(--page);z-index:5}
.bar .back{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:14px;color:var(--mute);padding:6px 0}
.dimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
.thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{flex:0 0 calc(33.333% - 4px);height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.thumbs img.on{outline:2px solid var(--teal);outline-offset:-1px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.head h1{font-size:20px;font-weight:700;margin:0;line-height:1.4}
.head .pr{font-size:17px;font-weight:700;color:var(--teal);white-space:nowrap}
.long{font-size:14px;color:var(--mute);line-height:1.9;margin-top:8px;white-space:pre-wrap}
.tip{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.9;color:var(--mute);white-space:pre-wrap}
.tip b{color:var(--ink)}
.fl{font-size:13px;font-weight:700;margin:14px 2px 5px}
.in{width:100%;background:var(--soft);border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);outline:0;line-height:1.6}
textarea.in{resize:vertical;min-height:90px}
.drop{border:1.5px dashed var(--teal);border-radius:12px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--teal);font-size:13px;gap:4px;cursor:pointer;background:transparent;width:100%}
.mainprev{position:relative;border-radius:12px;overflow:hidden}
.mainprev .chg{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:12.5px}
.exrow{display:flex;gap:8px;flex-wrap:wrap}
.ex{position:relative;width:calc(25% - 6px);aspect-ratio:1/1;border-radius:9px;overflow:hidden}
.ex img{width:100%;height:100%;object-fit:cover}
.ex button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.exadd{width:calc(25% - 6px);aspect-ratio:1/1;border-radius:9px;border:1.5px dashed var(--line);background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;padding:0}
.btns{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;border:0;border-radius:12px;padding:11px;font-size:15px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.main{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.btn.main{color:#06201C}}
.btn.danger{background:var(--danger);color:#fff}
.del{display:block;width:100%;border:0;background:transparent;color:var(--danger);font-size:13.5px;margin-top:10px;padding:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mbox{width:min(100%,330px);background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line)}
.mbox h3{margin:0 0 10px;font-size:16px;text-align:center}
.mbox p{margin:0 0 4px;font-size:14px;line-height:1.8;color:var(--mute);text-align:center}
.mbox .btns{margin-top:14px}
.pin{width:100%;text-align:center;font-size:26px;letter-spacing:12px;direction:ltr;background:var(--soft);border:0;border-radius:12px;padding:10px;color:var(--ink);outline:0;font-family:inherit}
.err{color:var(--danger);font-size:13px;text-align:center;min-height:22px;margin-top:6px}
.mi{display:block;width:100%;text-align:right;border:0;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:8px}
#hd{position:fixed;right:2px;top:0;width:7px;height:64px;border-radius:4px;background:var(--mute);opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
#hd.show{opacity:.7}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:rgba(20,30,28,.92);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="vList">
    <div class="top">
      <div class="sbox">
        <span id="icS"></span>
        <input id="q" type="search" placeholder="ابحث عن منتج" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="qx" class="ib plain" aria-label="مسح" hidden></button>
      </div>
      <button id="lockBtn" class="ib" aria-label="وضع المدير"></button>
    </div>
    <div id="mgr" class="mgr" hidden>
      <span class="badge">وضع المدير</span>
      <span class="sp"></span>
      <button id="menuBtn" class="ib plain" aria-label="القائمة"></button>
      <button id="exitBtn" class="lnk">خروج</button>
    </div>
    <div id="grid" class="grid3"></div>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div id="vDetail" hidden></div>
  <div id="vForm" hidden></div>
</div>
<button id="fab" class="fab" aria-label="إضافة منتج" hidden></button>
<input id="restoreIn" type="file" accept="application/json,.json" hidden>
<div id="hd"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var ICONS={
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',
dots:'<circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/>'
};
function ic(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/\s+/g,' ').trim();}
function cleanPrice(v){v=String(v||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[٫,]/g,'.').replace(/[^0-9.]/g,'');var i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');return v;}
function fmtPrice(v){return v!==''&&v!=null?esc(v)+' د.ل':'';}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2200);}

var db;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('productGuide',1);r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('products',{keyPath:'id'});d.createObjectStore('images',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=function(){db=r.result;res();};r.onerror=function(){rej(r.error);};});}
function reqP(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function getAll(s){return reqP(db.transaction(s).objectStore(s).getAll());}
function getOne(s,k){return reqP(db.transaction(s).objectStore(s).get(k));}
function runTx(names,fn){return new Promise(function(res,rej){var t=db.transaction(names,'readwrite');fn(t);t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('abort'));};});}
function putMany(pairs){var names=[];pairs.forEach(function(p){if(names.indexOf(p[0])<0)names.push(p[0]);});return runTx(names,function(t){pairs.forEach(function(p){t.objectStore(p[0]).put(p[1]);});});}
function delProduct(id){return runTx(['products','images'],function(t){t.objectStore('products').delete(id);t.objectStore('images').delete(id);});}
function replaceAll(ps,ims){return runTx(['products','images'],function(t){var a=t.objectStore('products'),b=t.objectStore('images');a.clear();b.clear();ps.forEach(function(p){a.put(p);});ims.forEach(function(i){b.put(i);});});}

var products=[];
function loadProducts(){return getAll('products').then(function(a){a.forEach(function(p){p._n=norm(p.name+' '+(p.desc||''));});a.sort(function(x,y){return (y.created||0)-(x.created||0);});products=a;});}

var isMgr=false;
function hash(p){try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('pg:'+p)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}catch(e){return Promise.resolve('x:'+p);}}
function getPin(){return getOne('meta','pin').then(function(m){return m?m.v:null;});}
function setPin(p){return hash(p).then(function(h){return putMany([['meta',{k:'pin',v:h}]]);});}

function modal(build){return new Promise(function(res){var ov=document.createElement('div');ov.className='ov';var box=document.createElement('div');box.className='mbox';ov.appendChild(box);$('#modalRoot').appendChild(ov);function close(v){ov.remove();res(v);}build(box,close);ov.addEventListener('click',function(e){if(e.target===ov)close(null);});});}
function confirmBox(msg,okText,danger){return modal(function(b,close){b.innerHTML='<p style="color:var(--ink);font-size:15px;margin-bottom:0">'+esc(msg)+'</p><div class="btns"><button class="btn '+(danger?'danger':'main')+'" id="mOk">'+esc(okText)+'</button><button class="btn" id="mNo">إلغاء</button></div>';b.querySelector('#mOk').onclick=function(){close(true);};b.querySelector('#mNo').onclick=function(){close(false);};}).then(function(v){return v===true;});}
function askPin(title,validate){return modal(function(b,close){b.innerHTML='<h3>'+esc(title)+'</h3><input class="pin" id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"><div class="err" id="pinErr"></div><div class="btns" style="margin-top:6px"><button class="btn" id="pinNo">إلغاء</button></div>';var inp=b.querySelector('#pinIn'),er=b.querySelector('#pinErr'),busy=false;setTimeout(function(){inp.focus();},50);inp.addEventListener('input',function(){inp.value=inp.value.replace(/[^0-9]/g,'');er.textContent='';if(inp.value.length===4&&!busy){busy=true;var v=inp.value;Promise.resolve(validate?validate(v):'').then(function(e){busy=false;if(e){er.textContent=e;inp.value='';}else close(v);});}});b.querySelector('#pinNo').onclick=function(){close(null);};});}
function login(){return getPin().then(function(cur){
 if(!cur){return askPin('أنشئ رمز المدير (4 أرقام)').then(function(a){if(!a)return;return askPin('أعد إدخال الرمز للتأكيد').then(function(b){if(!b)return;if(a!==b){toast('الرمزان غير متطابقين');return;}return setPin(a).then(function(){isMgr=true;toast('تم إنشاء الرمز');});});});}
 return askPin('أدخل رمز المدير',function(v){return hash(v).then(function(h){return h===cur?'':'الرمز غير صحيح';});}).then(function(v){if(v)isMgr=true;});
}).then(function(){syncMgr();if(st.v==='list')renderList();});}
function changePin(){return getPin().then(function(cur){return askPin('أدخل الرمز الحالي',function(v){return hash(v).then(function(h){return h===cur?'':'الرمز غير صحيح';});}).then(function(o){if(!o)return;return askPin('أدخل الرمز الجديد (4 أرقام)').then(function(a){if(!a)return;return askPin('أعد إدخال الرمز الجديد').then(function(b){if(!b)return;if(a!==b){toast('الرمزان غير متطابقين');return;}return setPin(a).then(function(){toast('تم تغيير الرمز');});});});});});}
function logout(){isMgr=false;syncMgr();if(st.v==='list')renderList();}

function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function shrink(src,max,q){return loadImg(src).then(function(im){var s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',q);});}
function fileToData(f,max,q){var u=URL.createObjectURL(f);return shrink(u,max,q).then(function(d){URL.revokeObjectURL(u);return d;},function(e){URL.revokeObjectURL(u);throw e;});}

var st={v:'list'},listScroll=0;
function nav(s){if(st.v==='list')listScroll=window.scrollY;history.pushState(s,'');show(s);}
window.addEventListener('popstate',function(e){show(e.state||{v:'list'});});
function show(s){
 st=s;
 $('#vList').hidden=s.v!=='list';$('#vDetail').hidden=s.v!=='detail';$('#vForm').hidden=s.v!=='form';
 if(s.v==='list'){renderList();window.scrollTo(0,listScroll);}
 else if(s.v==='detail'){$('#vDetail').innerHTML='';window.scrollTo(0,0);renderDetail(s.id);}
 else{$('#vForm').innerHTML='';window.scrollTo(0,0);renderForm(s.id,s.from);}
 syncMgr();
}
function syncMgr(){var l=st.v==='list';$('#mgr').hidden=!(isMgr&&l);$('#fab').hidden=!(isMgr&&l);$('#lockBtn').hidden=isMgr;}

function renderList(){
 var q=norm($('#q').value),tk=q?q.split(' '):[];
 $('#qx').hidden=!q;
 var list=tk.length?products.filter(function(p){return tk.every(function(t){return p._n.indexOf(t)>=0;});}):products;
 var g=$('#grid'),em=$('#empty');
 if(!list.length){g.innerHTML='';em.hidden=false;em.textContent=tk.length?'لا توجد نتائج':(isMgr?'ابدأ بإضافة أول منتج بالضغط على زر +':'لا توجد منتجات بعد. اطلب من المدير إضافتها.');return;}
 em.hidden=true;
 g.innerHTML=list.map(function(p){return '<div class="card" data-id="'+esc(p.id)+'"><div class="pic">'+(p.thumb?'<img src="'+p.thumb+'" alt="" loading="lazy" decoding="async">':'')+(isMgr?'<button class="pen" data-edit="'+esc(p.id)+'" aria-label="تعديل">'+ic('pencil',14)+'</button>':'')+'</div><div class="t">'+esc(p.name)+'</div>'+(p.desc?'<p class="d">'+esc(p.desc)+'</p>':'')+'<div class="p">'+fmtPrice(p.price)+'</div></div>';}).join('');
}

function renderDetail(id){
 var p=products.filter(function(x){return x.id===id;})[0];
 if(!p){history.back();return;}
 getOne('images',id).then(function(im){
  if(st.v!=='detail'||st.id!==id)return;
  var all=im?[im.main].concat(im.extra||[]).filter(Boolean):[];
  if(!all.length&&p.thumb)all=[p.thumb];
  var body=p.long||p.desc||'';
  $('#vDetail').innerHTML='<div class="bar"><button class="back" id="dBack">'+ic('back',18)+'<span>رجوع</span></button><span class="sp" style="flex:1"></span>'+(isMgr?'<button class="ib plain" id="dEdit" aria-label="تعديل">'+ic('pencil',18)+'</button>':'')+'</div>'+
  (all.length?'<img class="dimg" id="dMain" src="'+all[0]+'" alt="">':'')+
  (all.length>1?'<div class="thumbs" id="dThumbs">'+all.map(function(s,i){return '<img src="'+s+'" alt="" data-i="'+i+'"'+(i===0?' class="on"':'')+'>';}).join('')+'</div>':'')+
  '<div class="head"><h1>'+esc(p.name)+'</h1><div class="pr">'+fmtPrice(p.price)+'</div></div>'+
  (body?'<div class="long">'+esc(body)+'</div>':'')+
  (p.tip?'<div class="tip"><b>ملاحظة للموظف:</b> '+esc(p.tip)+'</div>':'');
  $('#dBack').onclick=function(){history.back();};
  var e=$('#dEdit');if(e)e.onclick=function(){nav({v:'form',id:id,from:'detail'});};
  var th=$('#dThumbs');if(th)th.onclick=function(ev){var t=ev.target.closest('img');if(!t)return;$('#dMain').src=all[+t.dataset.i];Array.prototype.forEach.call(th.children,function(c){c.classList.remove('on');});t.classList.add('on');};
 });
}

var fm={id:null,main:'',extra:[]};
function renderForm(id,from){
 var p=id?products.filter(function(x){return x.id===id;})[0]:null;
 if(id&&!p){history.back();return;}
 (id?getOne('images',id):Promise.resolve(null)).then(function(im){
  if(st.v!=='form'||st.id!==id)return;
  fm={id:id||null,main:im?im.main:'',extra:im?(im.extra||[]).slice():[]};
  $('#vForm').innerHTML='<div class="bar"><button class="back" id="fBack">'+ic('back',18)+'<span>إلغاء</span></button></div>'+
  '<div class="head"><h1>'+(p?'تعديل المنتج':'منتج جديد')+'</h1></div>'+
  '<div class="fl">الصورة الرئيسية</div><div id="mainArea"></div>'+
  '<div class="fl">اسم المنتج</div><input class="in" id="fName" maxlength="80" autocomplete="off">'+
  '<div class="fl">السعر (د.ل)</div><input class="in" id="fPrice" inputmode="decimal" autocomplete="off" style="direction:ltr;text-align:right">'+
  '<div class="fl">وصف قصير</div><input class="in" id="fDesc" maxlength="120" autocomplete="off">'+
  '<div class="fl">الشرح الكامل</div><textarea class="in" id="fLong" rows="4"></textarea>'+
  '<div class="fl">صور إضافية</div><div class="exrow" id="exArea"></div>'+
  '<div class="fl">ملاحظة للموظف (اختياري)</div><input class="in" id="fTip" autocomplete="off">'+
  '<div class="btns"><button class="btn main" id="fSave">حفظ</button><button class="btn" id="fCancel">إلغاء</button></div>'+
  (p?'<button class="del" id="fDel">حذف المنتج</button>':'')+
  '<input type="file" id="fMainIn" accept="image/*" hidden><input type="file" id="fExIn" accept="image/*" multiple hidden>';
  if(p){$('#fName').value=p.name;$('#fPrice').value=p.price||'';$('#fDesc').value=p.desc||'';$('#fLong').value=p.long||'';$('#fTip').value=p.tip||'';}
  paintImgs();
  $('#fBack').onclick=$('#fCancel').onclick=function(){history.back();};
  $('#fPrice').addEventListener('input',function(){var v=cleanPrice(this.value);if(v!==this.value)this.value=v;});
  $('#fMainIn').onchange=function(){var f=this.files[0];this.value='';if(!f)return;toast('جاري معالجة الصورة…');fileToData(f,900,0.82).then(function(d){fm.main=d;paintImgs();}).catch(function(){toast('تعذر قراءة الصورة');});};
  $('#fExIn').onchange=function(){var fs=Array.prototype.slice.call(this.files);this.value='';if(!fs.length)return;var room=8-fm.extra.length;if(room<=0){toast('الحد الأقصى 8 صور إضافية');return;}if(fs.length>room){toast('الحد الأقصى 8 صور إضافية');fs=fs.slice(0,room);}toast('جاري معالجة الصور…');var chain=Promise.resolve();fs.forEach(function(f){chain=chain.then(function(){return fileToData(f,900,0.82).then(function(d){fm.extra.push(d);paintImgs();});});});chain.catch(function(){toast('تعذر قراءة الصورة');});};
  $('#fSave').onclick=function(){saveForm(from);};
  var dl=$('#fDel');if(dl)dl.onclick=function(){confirmBox('حذف هذا المنتج نهائيا؟','حذف',true).then(function(ok){if(!ok)return;delProduct(id).then(loadProducts).then(function(){toast('تم الحذف');history.go(from==='detail'?-2:-1);}).catch(function(){toast('تعذر الحذف');});});};
 });
}
function paintImgs(){
 var m=$('#mainArea'),e=$('#exArea');if(!m||!e)return;
 m.innerHTML=fm.main?'<div class="mainprev"><img class="dimg" src="'+fm.main+'" alt=""><button class="chg" id="chgMain">تغيير الصورة</button></div>':'<button class="drop" id="chgMain">'+ic('plus',24)+'<span>التقاط صورة أو اختيار من المعرض</span></button>';
 $('#chgMain').onclick=function(){$('#fMainIn').click();};
 e.innerHTML=fm.extra.map(function(s,i){return '<div class="ex"><img src="'+s+'" alt=""><button data-rm="'+i+'" aria-label="حذف الصورة">'+ic('x',12)+'</button></div>';}).join('')+(fm.extra.length<8?'<button class="exadd" id="exAdd" aria-label="إضافة صورة">'+ic('plus',22)+'</button>':'');
 var a=$('#exAdd');if(a)a.onclick=function(){$('#fExIn').click();};
 Array.prototype.forEach.call(e.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){fm.extra.splice(+b.dataset.rm,1);paintImgs();};});
}
function saveForm(from){
 var name=$('#fName').value.trim();
 if(!name){toast('أدخل اسم المنتج');$('#fName').focus();return;}
 if(!fm.main){toast('أضف الصورة الرئيسية');return;}
 var btn=$('#fSave');btn.disabled=true;
 var old=fm.id?products.filter(function(x){return x.id===fm.id;})[0]:null;
 shrink(fm.main,360,0.75).then(function(thumb){
  var now=Date.now();
  var id=fm.id||('p'+now.toString(36)+Math.random().toString(36).slice(2,6));
  var p={id:id,name:name,price:cleanPrice($('#fPrice').value),desc:$('#fDesc').value.trim(),long:$('#fLong').value.trim(),tip:$('#fTip').value.trim(),thumb:thumb,created:old?old.created:now,updated:now};
  return putMany([['products',p],['images',{id:id,main:fm.main,extra:fm.extra}]]).then(loadProducts).then(function(){if(!old)listScroll=0;toast('تم الحفظ');history.back();});
 }).catch(function(){btn.disabled=false;toast('تعذر الحفظ، قد تكون المساحة ممتلئة');});
}

function openMenu(){modal(function(b,close){b.innerHTML='<h3>القائمة</h3><button class="mi" id="mBk">نسخة احتياطية</button><button class="mi" id="mRs">استعادة نسخة</button><button class="mi" id="mPin">تغيير رمز المدير</button><div class="btns"><button class="btn" id="mCl">إغلاق</button></div>';b.querySelector('#mBk').onclick=function(){close();backup();};b.querySelector('#mRs').onclick=function(){close();$('#restoreIn').click();};b.querySelector('#mPin').onclick=function(){close();changePin();};b.querySelector('#mCl').onclick=function(){close();};});}
function backup(){
 toast('جاري تجهيز النسخة…');
 Promise.all([getAll('products'),getAll('images')]).then(function(r){
  var ps=r[0].map(function(p){var c={};for(var k in p){if(k!=='_n')c[k]=p[k];}return c;});
  var blob=new Blob([JSON.stringify({app:'product-guide',v:1,date:new Date().toISOString(),products:ps,images:r[1]})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='product-guide-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
  toast('تم تنزيل النسخة الاحتياطية');
 }).catch(function(){toast('تعذر إنشاء النسخة');});
}
$('#restoreIn').onchange=function(){
 var f=this.files[0];this.value='';if(!f)return;
 f.text().then(function(t){
  var d=JSON.parse(t);
  if(!d||d.app!=='product-guide'||!Array.isArray(d.products)||!Array.isArray(d.images))throw new Error('bad');
  return confirmBox('سيتم استبدال كل المنتجات الحالية بـ '+d.products.length+' منتج من النسخة. متابعة؟','استعادة',true).then(function(ok){
   if(!ok)return;
   return replaceAll(d.products,d.images).then(loadProducts).then(function(){listScroll=0;renderList();toast('تمت الاستعادة');});
  });
 }).catch(function(){toast('ملف النسخة غير صالح');});
};

var hd=$('#hd'),ht;
window.addEventListener('scroll',function(){
 var de=document.documentElement,max=de.scrollHeight-window.innerHeight;
 if(max<=40)return;
 var r=Math.min(1,Math.max(0,window.scrollY/max));
 hd.style.transform='translateY('+Math.round(14+r*(window.innerHeight-64-28))+'px)';
 hd.classList.add('show');clearTimeout(ht);ht=setTimeout(function(){hd.classList.remove('show');},900);
},{passive:true});

$('#icS').innerHTML=ic('search',18);
$('#qx').innerHTML=ic('x',16);
$('#lockBtn').innerHTML=ic('lock',20);
$('#menuBtn').innerHTML=ic('dots',20);
$('#fab').innerHTML=ic('plus',28);
$('#q').addEventListener('input',renderList);
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter')this.blur();});
$('#qx').onclick=function(){$('#q').value='';renderList();$('#q').focus();};
$('#lockBtn').onclick=login;
$('#exitBtn').onclick=logout;
$('#menuBtn').onclick=openMenu;
$('#fab').onclick=function(){nav({v:'form',id:null,from:'list'});};
$('#grid').addEventListener('click',function(e){
 var pe=e.target.closest('[data-edit]');
 if(pe){e.stopPropagation();nav({v:'form',id:pe.dataset.edit,from:'list'});return;}
 var c=e.target.closest('.card');if(c)nav({v:'detail',id:c.dataset.id});
});

openDB().then(loadProducts).then(function(){
 history.replaceState({v:'list'},'');
 show({v:'list'});
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}).catch(function(){
 $('#empty').hidden=false;$('#empty').textContent='تعذر فتح قاعدة البيانات. تأكد أن التصفح الخاص غير مفعل.';
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}
})();
</script>
</body>
</html>
